services:
  # --- DB de tu API (necesaria para que /docs responda en CI/ZAP) ---
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: multitalent
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - api_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - multitalent_net

  # --- API ---
  api:
    image: ${IMAGE:-multitalent-backend/api:prod}
    build:
      context: .
    env_file:
      - .env.example
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://user:password@db:5432/multitalent
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://user:password@db:5432/multitalent
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - multitalent_net
    command: >
      gunicorn
      -w ${WEB_CONCURRENCY:-2}
      -k gthread --threads ${GTHREADS:-8}
      --timeout ${TIMEOUT:-60}
      -b 0.0.0.0:8000
      app.wsgi:app
    ports:
      - "8000:8000"

  # --- Sonar DB ---
  sonar_db:
    image: postgres:15
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - multitalent_net

  # --- SonarQube ---
  sonarqube:
    image: sonarqube:lts-community
    depends_on:
      - sonar_db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - multitalent_net

  # --- ZAP (solo para correr herramientas si quieres en local) ---
  zap:
    image: owasp/zap2docker-stable
    profiles: ["tools"]
    entrypoint: ["sleep", "infinity"]
    networks:
      - multitalent_net

volumes:
  api_db_data:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  multitalent_net:
    external: true
