version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
      - image: postgres:15
        environment:
          POSTGRES_DB: multitalent
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password

    environment:
      DATABASE_URL: postgresql+psycopg2://user:password@127.0.0.1:5432/multitalent
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://user:password@127.0.0.1:5432/multitalent

    working_directory: ~/workspace

    steps:
      - checkout

      - run:
          name: wait-postgres
          command: |
            for i in $(seq 1 30); do
              pg_isready -h 127.0.0.1 -U user && exit 0
              sleep 2
            done
            echo "Postgres no estuvo listo a tiempo"
            exit 1

      - run:
          name: install-deps
          command: |
            python -m pip install -U pip
            pip install -r requirements.txt

      - run:
          name: migrate-seed
          command: |
            flask --app app.wsgi db upgrade
            flask --app app.wsgi seed-admin

      - run:
          name: flake8
          command: |
            pip install flake8
            flake8 . --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

      - run:
          name: mypy
          command: |
            pip install mypy types-requests types-psycopg2
            mypy app || true

      - run:
          name: bandit
          command: |
            pip install bandit
            bandit -r app -f xml -o bandit-report.xml || true

      - run:
          name: pytest
          command: |
            pip install pytest pytest-cov
            pytest -v --maxfail=1 --junitxml=pytest-report.xml --cov=app --cov-report=xml:coverage.xml

      - store_artifacts:
          path: pytest-report.xml
          destination: reports/pytest

      - store_artifacts:
          path: coverage.xml
          destination: reports/coverage

      - store_artifacts:
          path: bandit-report.xml
          destination: reports/security

      - persist_to_workspace:
          root: .
          paths:
            - coverage.xml
            - pytest-report.xml
            - bandit-report.xml
            - sonar-project.properties


  sonarqube-scan:
    machine: true
    working_directory: ~/project

    steps:
      - checkout

      - attach_workspace:
          at: ~/project

      - run:
          name: validate-sonar-env
          command: |
            if [ -z "${SONAR_HOST_URL}" ]; then echo "Falta SONAR_HOST_URL"; exit 1; fi
            if [ -z "${SONAR_TOKEN}" ]; then echo "Falta SONAR_TOKEN"; exit 1; fi
            echo "SONAR_HOST_URL=${SONAR_HOST_URL}"

      - run:
          name: sonar-scan
          command: |
            docker run --rm \
              -v "$(pwd):/usr/src" \
              -w /usr/src \
              sonarsource/sonar-scanner-cli:latest \
              sonar-scanner \
                -Dsonar.host.url="${SONAR_HOST_URL}" \
                -Dsonar.token="${SONAR_TOKEN}" \
                -Dsonar.qualitygate.wait=true \
                -Dsonar.projectVersion="${CIRCLE_SHA1}"


  zap-dast:
    machine: true
    working_directory: ~/project

    steps:
      - checkout

      - run:
          name: create-network
          command: |
            docker network inspect multitalent_net >/dev/null 2>&1 || docker network create multitalent_net

      - run:
          name: ensure-env-file
          command: |
            rm -f .env
            printf "POSTGRES_DB=multitalent\n" >> .env
            printf "POSTGRES_USER=user\n" >> .env
            printf "POSTGRES_PASSWORD=password\n" >> .env
            printf "DB_HOST=db\n" >> .env
            printf "DB_PORT=5432\n" >> .env
            printf "DATABASE_URL=postgresql+psycopg2://user:password@db:5432/multitalent\n" >> .env
            printf "SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://user:password@db:5432/multitalent\n" >> .env
            printf "RESET_TOKEN_HOURS=2\n" >> .env
            printf "MAIL_PORT=587\n" >> .env
            printf "SECRET_KEY=circleci_dummy_secret\n" >> .env
            echo ".env creado:"
            cat .env

      - run:
          name: show-services
          command: |
            docker compose config --services

      - run:
          name: up-db-api
          command: |
            docker compose up -d --build db api
            docker compose ps

      - run:
          name: wait-api-docs
          command: |
            for i in $(seq 1 90); do
              for path in /docs /docs/ /api-docs /api-docs/; do
                code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000${path}" || true)
                if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
                  echo "API OK en ${path} (HTTP $code)"
                  echo "export ZAP_TARGET=http://localhost:8000${path}" >> "$BASH_ENV"
                  source "$BASH_ENV"
                  exit 0
                fi
              done

              echo "Esperando API..."
              if [ $i -eq 20 ] || [ $i -eq 45 ] || [ $i -eq 75 ]; then
                docker compose ps || true
                docker compose logs --tail=160 api || true
              fi
              sleep 2
            done

            echo "API no respondió en docs/api-docs"
            docker compose logs api || true
            docker compose logs db || true
            exit 1

      - run:
          name: zap-baseline
          command: |
            source "$BASH_ENV"
            docker run --rm --network host \
              -v "$(pwd):/zap/wrk" \
              owasp/zap2docker-stable \
              zap-baseline.py -t "${ZAP_TARGET}" -r zap-report.html -J zap-report.json || true

      - store_artifacts:
          path: zap-report.html
          destination: reports/zap

      - store_artifacts:
          path: zap-report.json
          destination: reports/zap

      - run:
          name: down
          when: always
          command: |
            docker compose down -v


workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build-and-test
      - sonarqube-scan:
          requires:
            - build-and-test
      - zap-dast:
          requires:
            - build-and-test
