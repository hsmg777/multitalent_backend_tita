version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
      - image: postgres:15
        environment:
          POSTGRES_DB: multitalent
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
    environment:
      DATABASE_URL: postgresql+psycopg2://user:password@localhost:5432/multitalent
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://user:password@localhost:5432/multitalent
      COMPOSE_PROJECT: multitalent_backend
      COMPOSE_FILE: docker-compose.yml
    working_directory: ~/workspace
    steps:
      - checkout

      - run:
          name: wait-postgres
          command: |
            for i in `seq 1 30`;
            do
              pg_isready -h localhost -U user && break
              sleep 2
            done

      - run:
          name: install-deps
          command: |
            python -m pip install -U pip
            pip install -r requirements.txt

      - run:
          name: migrate-seed
          command: |
            flask --app app.wsgi db upgrade
            flask --app app.wsgi seed-admin

      - run:
          name: flake8
          command: |
            pip install flake8
            flake8 . --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

      - run:
          name: mypy
          command: |
            pip install mypy types-requests types-psycopg2
            mypy app || true

      - run:
          name: bandit
          command: |
            pip install bandit
            bandit -r app -f xml -o bandit-report.xml || true

      - run:
          name: pytest
          command: |
            pip install pytest pytest-cov
            pytest -v --maxfail=1 --junitxml=pytest-report.xml --cov=app --cov-report=xml:coverage.xml

      - store_artifacts:
          path: pytest-report.xml
          destination: reports/pytest
      - store_artifacts:
          path: coverage.xml
          destination: reports/coverage
      - store_artifacts:
          path: bandit-report.xml
          destination: reports/security

      - persist_to_workspace:
          root: .
          paths:
            - coverage.xml
            - pytest-report.xml
            - bandit-report.xml
            - sonar-project.properties

      - run:
          name: telegram-success
          when: on_success
          command: |
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="✅ *Build completado correctamente en CircleCI!*%0AProyecto: multitalent_backend_tita%0ARama: ${CIRCLE_BRANCH}%0AJob: ${CIRCLE_JOB}%0A🔗 [Ver detalles en CircleCI](${CIRCLE_BUILD_URL})" \
              -d parse_mode="Markdown"

      - run:
          name: telegram-fail
          when: on_fail
          command: |
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="❌ *Build falló!*%0AProyecto: multitalent_backend_tita%0ARama: ${CIRCLE_BRANCH}%0AJob: ${CIRCLE_JOB}%0A🔗 [Ver errores en CircleCI](${CIRCLE_BUILD_URL})" \
              -d parse_mode="Markdown"

  sonarqube-scan:
    docker:
      - image: sonarsource/sonar-scanner-cli:latest
    working_directory: /usr/src
    steps:
      - checkout
      - attach_workspace:
          at: /usr/src
      - run:
          name: sonar-scan
          command: |
            sonar-scanner \
              -Dsonar.host.url=${SONAR_HOST_URL} \
              -Dsonar.login=${SONAR_TOKEN} \
              -Dsonar.qualitygate.wait=true

  zap-dast:
    machine: true
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: up-app
          command: |
            docker compose -f docker-compose.dast.yml up -d --build
      - run:
          name: wait-nginx
          command: |
            for i in `seq 1 60`; do
              curl -sSf "http://localhost:5000" >/dev/null 2>&1 && exit 0
              sleep 2
            done
            exit 1
      - run:
          name: zap-baseline
          command: |
            TARGET="${ZAP_TARGET:-http://localhost:5000}"
            docker run --rm --network host \
              -v "$(pwd):/zap/wrk" \
              owasp/zap2docker-stable \
              zap-baseline.py -t "$TARGET" -r zap-report.html -J zap-report.json || true
      - store_artifacts:
          path: zap-report.html
          destination: reports/zap
      - store_artifacts:
          path: zap-report.json
          destination: reports/zap
      - run:
          name: down-app
          when: always
          command: |
            docker compose -f docker-compose.dast.yml down -v

  deploy:
    machine: true
    steps:
      - checkout
      - run:
          name: deploy
          command: |
            docker compose pull
            docker compose down --remove-orphans
            docker compose up -d --build
            docker compose ps
      - run:
          name: telegram-deploy
          when: on_success
          command: |
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="🚀 *Despliegue completado correctamente!*%0AProyecto: multitalent_backend_tita%0ARama: ${CIRCLE_BRANCH}%0A🔗 [Ver build en CircleCI](${CIRCLE_BUILD_URL})" \
              -d parse_mode="Markdown"

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build-and-test
      - sonarqube-scan:
          requires:
            - build-and-test
      - zap-dast:
          requires:
            - build-and-test
      - deploy:
          requires:
            - sonarqube-scan
            - zap-dast
          filters:
            branches:
              only:
                - develop
                - main
